<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="card">
      <section class="result">
        <h1>Your Result</h1>
        <div class="score">
          <strong>76</strong>
          <span>of 100</span>
        </div>
        <h2>Great</h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>
      <section class="summary">
        <h1>Summary</h1>
        <ul>
          <li class="reaction">
            <div class="label">
              <img
                src="assets/images/icon-reaction.svg"
                alt="Reaction icon"
                width="20px"
                height="20px"
              />
              <span>Reaction</span>
            </div>
            <p><strong>80</strong> / 100</p>
          </li>
          <li class="memory">
            <div class="label">
              <img
                src="assets/images/icon-memory.svg"
                alt="Memory icon"
                width="20px"
                height="20px"
              />
              <span>Memory</span>
            </div>
            <p><strong>92</strong> / 100</p>
          </li>
          <li class="verbal">
            <div class="label">
              <img
                src="assets/images/icon-verbal.svg"
                alt="Verbal icon"
                width="20px"
                height="20px"
              />
              <span>Verbal</span>
            </div>
            <p><strong>61</strong> / 100</p>
          </li>
          <li class="visual">
            <div class="label">
              <img
                src="assets/images/icon-visual.svg"
                alt="Visual icon"
                width="20px"
                height="20px"
              />
              <span>Visual</span>
            </div>
            <p><strong>73</strong> / 100</p>
          </li>
        </ul>
        <button>Continue</button>
      </section>
    </main>
  </body>
</html>
